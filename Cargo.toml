[package]
name = "conductor"
version = "1.7.2"
edition = "2024"
description = "A music server for Encore and any Subsonic / OpenSubsonic app"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# the SQLite built into sqlx: 0.39 and later have the fix for CVE-2026-119375 (RUSTSEC-2026-0459)
libsqlite3-sys = { version = ">=0.39, <0.41", default-features = false }
lofty = "0.22"
walkdir = "2"
md5 = "0.7"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
form_urlencoded = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
roxmltree = "0.20"
regex = "1"
unicode-normalization = "0.1"
strsim = "0.11"
sha1 = "0.10"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
rpassword = "7.5.5"
base64 = "0.23.1"
zeroize = "1.9.2"
realfft = "3.5.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
